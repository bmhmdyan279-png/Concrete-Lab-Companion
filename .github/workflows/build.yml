name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'landing/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'build-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: Golden Tests & Excel Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install openpyxl pyyaml pytest pytest-cov xlsxwriter

      - name: Run Golden Tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short -m golden
          else
            echo "No tests found, skipping"
          fi

      - name: Download latest Excel from Release
        id: download
        continue-on-error: true
        run: |
          echo "Attempting to download latest Excel from GitHub Releases..."
          RELEASE_INFO=$(curl -s -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.xlsx"' | head -1 | cut -d'"' -f4)

          if [ -n "$DOWNLOAD_URL" ]; then
            mkdir -p .audit
            curl -L -o .audit/excel.xlsx "$DOWNLOAD_URL"
            echo "downloaded=true" >> $GITHUB_OUTPUT
            echo "✅ Excel downloaded from Release"
          else
            echo "downloaded=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Excel found in latest Release"
          fi

      - name: Run Excel Audit
        if: steps.download.outputs.downloaded == 'true'
        run: |
          if [ -f "scripts/audit_excel.py" ]; then
            python scripts/audit_excel.py
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-audit-report
          path: |
            docs/qa/EXCEL_AUDIT_REPORT.json
            validation/formulas_audit.txt
          if-no-files-found: ignore
