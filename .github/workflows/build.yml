name: Build and Release Concrete Lab Companion

on:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script
        run: python build.py --output output

      - name: Upload artifact (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: Concrete-Lab-Companion
          path: output/*.xlsx

      - name: Upload to Release (if release)
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: output/Concrete_Lab_Companion_v2.1.0.xlsx
          asset_name: Concrete_Lab_Companion_v2.1.0.xlsx
          asset_content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
