name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Workbook
        run: python build.py

      - name: Verify required sheets exist
        run: |
          python -c "
          import openpyxl, yaml, sys
          with open('config.yaml') as f:
              cfg = yaml.safe_load(f)
          wb = openpyxl.load_workbook('output/Concrete_Lab_Companion_v1.0.0.xlsx')
          required = cfg['sheets']['key_sheets']
          missing = [s for s in required if s not in wb.sheetnames]
          if missing:
              print(f'FAIL: Missing sheets: {missing}')
              sys.exit(1)
          print(f'PASS: All {len(required)} required sheets present')
          "

      - name: Check input cells are unlocked
        run: |
          python -c "
          import openpyxl, sys
          wb = openpyxl.load_workbook('output/Concrete_Lab_Companion_v1.0.0.xlsx')
          # Add specific input cell checks here
          print('PASS: Cell protection check completed')
          "

      - name: Run Golden Tests
        run: |
          python -c "
          import json, os, sys
          cases_dir = 'validation/golden_cases'
          passed = failed = 0
          for f in sorted(os.listdir(cases_dir)):
              if f.endswith('.json'):
                  with open(os.path.join(cases_dir, f)) as fh:
                      case = json.load(fh)
                  # TODO: Add actual calculation verification
                  passed += 1
                  print(f'  PASS: {case[\"test_id\"]} — {case[\"test_name\"]}')
          print(f'Total: {passed} passed, {failed} failed')
          if failed > 0:
              sys.exit(1)
          "

      - name: Generate SHA-256
        if: success()
        run: |
          sha256sum output/Concrete_Lab_Companion_v1.0.0.xlsx > output/Concrete_Lab_Companion_v1.0.0.xlsx.sha256
          cat output/Concrete_Lab_Companion_v1.0.0.xlsx.sha256
