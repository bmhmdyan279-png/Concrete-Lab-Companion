name: "🐛 گزارش مغایرت پیش‌نویس (Pre-Publication Errata)"
description: "برای گزارش خطاهای محاسباتی، باگ‌های فرمول یا مغایرت‌های متن پیش‌نویس کتاب با ابزار دیجیتال"
title: "[Errata]: "
labels: ["errata", "pre-publication", "triage"]
body:
  - type: markdown
    attributes:
      value: "از شما برای کمک به بهبود پیش‌نویس کتاب و ابزار دیجیتال سپاسگزاریم. لطفاً موارد زیر را با دقت تکمیل کنید."
  - type: dropdown
    id: test_code
    attributes:
      label: "کد آزمایش (شیت)"
      options: ["1-1 دانه‌بندی", "1-2 رطوبت", "1-3 وزن مخصوص", "1-4 جذب", "2-4 مقاومت ملات", "4-1 فشاری", "4-5 اشمیت", "سایر"]
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: "شرح مغایرت یا خطا"
      description: "عدد کتاب (پیش‌نویس) و عدد خروجی ابزار را وارد کنید. چرا فکر می‌کنید ابزار یا کتاب اشتباه کرده است؟"
    validations:
      required: true
